<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chimie en PC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Source+Sans+3:wght@400;600&family=STIX+Two+Text:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout : une scène de paillasse (dessin) + une colonne latérale (profil énergétique, points clés) */
:root{
  --bg:#eef1f4; --paper:#fbfcfd; --ink:#18202c; --muted:#5a6475; --rule:#d5dbe3;
  --accent:#24557a; --accent-soft:#dfe8f1; --arrow:#c62f3b;
  --display:"Spectral", Georgia, serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --chem:"STIX Two Text", Cambria, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141a; --paper:#161d26; --ink:#e4e8ee; --muted:#93a0b2; --rule:#2a3442;
  --accent:#7fb3dd; --accent-soft:#1f2c3a; --arrow:#ff7070; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f141a; --paper:#161d26; --ink:#e4e8ee; --muted:#93a0b2; --rule:#2a3442;
  --accent:#7fb3dd; --accent-soft:#1f2c3a; --arrow:#ff7070; color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
[hidden]{display:none!important}
.app{max-width:1180px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,3vw,2.1rem);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0}
.viewmeca{display:grid;gap:16px}
.intro{margin:0;color:var(--muted)}
.retour{font:14px var(--body);color:var(--accent);margin-left:12px;vertical-align:middle}
/* deux parties du site : grands onglets soulignés */
header.top{display:grid;gap:12px;justify-content:normal;align-items:normal}
.maintabs{display:flex;gap:4px;border-bottom:2px solid var(--rule)}
.mtab{display:grid;gap:1px;text-align:left;background:transparent;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;
  padding:8px 16px 10px;cursor:pointer;color:var(--muted);border-radius:8px 8px 0 0}
.mtab:hover{color:var(--ink);background:var(--accent-soft)}
.mtab-t{font:600 1.08rem var(--display)}
.mtab-s{font-size:.82rem}
.mtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.mtab[aria-selected="true"] .mtab-t{color:var(--accent)}
@media (max-width:560px){.mtab{padding:8px 10px}.mtab-s{display:none}}
/* atlas : liste de chapitres à gauche, contenu à droite ; la feuille reste claire dans les deux thèmes */
.atlas{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.agrid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.alist{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;background:var(--paper);border:1px solid var(--rule);
  border-radius:10px;padding:10px 8px;display:grid;gap:2px}
.alist h4{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 8px 4px}
.alist h4:first-child{margin-top:2px}
.aitem{display:flex;gap:8px;align-items:baseline;text-align:left;font:14px var(--body);color:var(--ink);background:transparent;border:0;
  border-radius:6px;padding:5px 8px;cursor:pointer}
.aitem:hover{background:var(--accent-soft)}
.aitem[aria-current="true"]{background:var(--accent);color:var(--paper)}
.aitem .an{font-variant-numeric:tabular-nums;min-width:1.6em;color:inherit;opacity:.75;font-weight:600}
.asel-l{display:none;gap:4px;font-size:.9rem;color:var(--muted)}
.asel-l{min-width:0}
.asel{width:100%;min-width:0;font:15px var(--body);padding:7px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink)}
.abody{display:grid;gap:16px;min-width:0}
@media (max-width:900px){.agrid{grid-template-columns:minmax(0,1fr)}.alist{display:none}.asel-l{display:grid}}
.achap{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.achap h2{font-family:var(--display);font-weight:500;font-size:1.3rem;margin:0}
.achap span{color:var(--muted)}
.exo{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.exo-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.exo-h h3{font-family:var(--display);font-weight:500;font-size:1.1rem;margin:0}
.exo-n{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.diff{color:var(--accent);letter-spacing:.1em}
.exo-a{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:600 13px var(--body);background:transparent;color:var(--arrow);border:1px solid var(--arrow);border-radius:999px;padding:4px 10px;cursor:pointer}
.sheet{--sheet:#ffffff;--sheet-ink:#17202b;background:var(--sheet);color:var(--sheet-ink);border-radius:8px;padding:10px 12px;overflow-x:auto;
  font-size:15px;line-height:1.45;border:1px solid var(--rule)}
.sheet.corr{border-color:var(--arrow);border-left-width:4px}
.sheet .q{margin:.2em 0 .5em}
.sheet img{vertical-align:middle;max-width:100%;height:auto}
.sheet .num{display:inline-flex;align-items:center;justify-content:center;min-width:1.45em;height:1.45em;padding:0 .15em;border:1.3px solid currentColor;
  border-radius:999px;font-size:.78em;margin-right:.3em;vertical-align:middle;font-variant-numeric:tabular-nums}
.sheet .ct{text-align:center}
.sheet .sm{font-size:.86em;color:#4b5563}
.sheet .m,.sheet .ce{font-family:var(--chem)}
.sheet sub,.sheet sup{font-size:.72em}
.xa{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .35em;font-size:.82em;line-height:1.15;font-family:var(--body)}
.xa-f{display:block;align-self:stretch;min-width:3.2em;border-top:1.4px solid currentColor;position:relative;margin:3px 0}
.xa-f::after{content:"";position:absolute;right:-1px;top:-5.2px;border:4.5px solid transparent;border-left:8px solid currentColor;border-right:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em}
.fr>span:first-child{border-bottom:1px solid currentColor}
table.gr{width:100%;border-collapse:collapse}
table.gr td{padding:10px 6px;text-align:center;vertical-align:middle;border-bottom:1px dashed #d4d9e0}
table.tb{border-collapse:collapse;margin:6px auto}
table.tb td{border:1px solid #b8c0cb;padding:3px 8px}
ul.en,ul.it{margin:.3em 0;padding-left:0;list-style:none;display:grid;gap:4px}
ul.it li::before{content:"• "}
.cols{columns:2 16em}
.alinks{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.alinks a{color:var(--accent)}
.amsg{color:var(--muted)}
.sheet .mp{display:inline-block;vertical-align:top;max-width:100%;margin:6px 8px;text-align:center}
.sheet .it{font-style:italic}
.sheet .bf{font-weight:600}
.sheet ul.mols{columns:2 16em;margin:.3em 0;padding-left:1.3em}
.sheet ul.mols li{margin:2px 0}

.tabs{display:grid;gap:8px}
.tabrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tabgrp{font:600 12px var(--body);letter-spacing:.08em;color:var(--muted);width:3.4em}
.tab{font:600 15px var(--body);color:var(--muted);background:transparent;border:1px solid var(--rule);
  border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink);border-color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--paper);border:1px solid var(--rule);border-radius:10px;display:grid;min-width:0}
.mech-title{padding:14px 18px 0;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.mech-title h2{font-family:var(--display);font-weight:500;font-size:1.25rem;margin:0}
.mech-title span{color:var(--muted);font-size:.95rem}
.scene-wrap{position:relative}
#scene{display:block;width:100%;height:auto}
.reveal{position:absolute;right:12px;top:10px;font:600 14px var(--body);background:var(--arrow);color:var(--paper);
  border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 18px;border-top:1px solid var(--rule)}
.nav{display:flex;gap:6px;align-items:center}
.btn{font:600 15px var(--body);background:var(--accent-soft);color:var(--ink);border:1px solid var(--rule);
  border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.pill{font:14px var(--body);background:transparent;color:var(--muted);border:1px solid var(--rule);border-radius:6px;
  padding:4px 10px;cursor:pointer;font-variant-numeric:tabular-nums}
.pill[aria-current="step"]{color:var(--ink);border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-left:auto;font-size:14px;color:var(--muted)}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.caption{padding:4px 18px 18px;max-width:72ch}
.caption h3{font-family:var(--display);font-weight:500;font-size:1.1rem;margin:6px 0 2px}
.caption p{margin:0}
.quizhint{color:var(--arrow);font-size:.95rem;margin-top:6px!important}
aside{display:grid;gap:16px;min-width:0}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.card h4{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
#profile{display:block;width:100%;height:auto}
dl{margin:0;display:grid;gap:10px}
dt{font-weight:600;font-size:.9rem}
dd{margin:0;color:var(--muted);font-size:.95rem}
dd .f{font-family:var(--chem);color:var(--ink)}
.legend{font-size:.85rem;color:var(--muted);margin:8px 0 0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* dessin */
.lbl{font-family:var(--chem);font-size:22px;fill:var(--ink)}
.bd{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round}
.bd.dash{stroke-dasharray:4 5}
.wedge{fill:var(--ink)}
.lp{fill:var(--ink)}
.chg circle{fill:var(--paper);stroke:var(--ink);stroke-width:1.3}
.chg text{font-family:var(--body);font-size:15px;font-weight:600;fill:var(--ink)}
.brk{stroke:var(--ink);stroke-width:1.6;fill:none}
.mark{font-family:var(--chem);font-size:22px;fill:var(--ink)}
.n-d{font-family:var(--chem);font-style:italic;font-size:17px;fill:var(--muted)}
.n-p{font-family:var(--chem);font-size:26px;fill:var(--ink)}
.n-n{font-family:var(--body);font-size:15px;fill:var(--muted)}
.arr path{stroke:var(--arrow);stroke-width:2.2;fill:none;stroke-linecap:round}
.arr polygon{fill:var(--arrow)}
.arr text{font-family:var(--body);font-size:14px;font-weight:600;fill:var(--arrow)}
.ax{stroke:var(--muted);stroke-width:1.2;fill:none}
.axt{font-family:var(--body);font-size:11px;fill:var(--muted)}
.curve{stroke:var(--accent);stroke-width:2.2;fill:none}
.kpl{font-family:var(--chem);font-size:12px;fill:var(--ink)}
.dot{fill:var(--arrow)}
</style>

<svg id="measure" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden;visibility:hidden"><text class="lbl" id="mtext"></text></svg>

<div class="app">
  <header class="top">
    <h1>Chimie en PC <a class="retour" href="../">site de PCSI</a></h1>
    <nav class="maintabs" role="tablist" aria-label="Parties du site">
      <button class="mtab" role="tab" id="vb-meca" aria-selected="true" aria-controls="view-meca">
        <span class="mtab-t">Mécanismes animés</span><span class="mtab-s">chimie organique, étape par étape</span></button>
      <button class="mtab" role="tab" id="vb-atlas" aria-selected="false" aria-controls="view-atlas">
        <span class="mtab-t">Atlas d'entraînement</span><span class="mtab-s">exercices et corrigés, tous chapitres</span></button>
    </nav>
  </header>
  <section id="view-atlas" class="atlas" role="tabpanel" aria-labelledby="vb-atlas" hidden>
    <div class="agrid">
      <nav class="alist" id="atlas-tabs" aria-label="Chapitres des atlas"></nav>
      <label class="asel-l" for="atlas-select">Chapitre
        <select id="atlas-select" class="asel"></select></label>
      <div id="atlas-body" class="abody"></div>
    </div>
  </section>
  <div id="view-meca" class="viewmeca" role="tabpanel" aria-labelledby="vb-meca">
  <p class="intro">Choisissez un mécanisme, puis avancez avec les flèches ← → ou le bouton Lecture.</p>
  <nav class="tabs" id="tabs" aria-label="Mécanismes"></nav>
  <div class="main">
    <section class="stage">
      <div class="mech-title"><h2 id="mname"></h2><span id="mreac"></span></div>
      <div class="scene-wrap">
        <svg id="scene" viewBox="135 22 650 312" role="img" aria-labelledby="stepname"><g id="g-mol"></g><g id="g-arr" class="arr"></g></svg>
        <button class="reveal" id="btn-reveal" hidden>Révéler les flèches</button>
      </div>
      <div class="controls">
        <div class="nav">
          <button class="btn" id="btn-prev" aria-label="Étape précédente">←</button>
          <button class="btn" id="btn-play">Lecture</button>
          <button class="btn" id="btn-next" aria-label="Étape suivante">→</button>
        </div>
        <div class="steps" id="steps"></div>
        <div class="opts">
          <label><input type="checkbox" id="chk-lp" checked> Doublets non liants</label>
          <label><input type="checkbox" id="chk-quiz"> Mode quiz</label>
        </div>
      </div>
      <div class="caption">
        <h3 id="stepname"></h3>
        <p id="steptext"></p>
        <p class="quizhint" id="quizhint" hidden>Propose les flèches courbes avant de les révéler.</p>
      </div>
    </section>
    <aside>
      <div class="card">
        <h4>Profil énergétique</h4>
        <svg id="profile" viewBox="0 0 300 186" role="img" aria-label="Profil énergétique qualitatif"></svg>
        <p class="legend">Allure qualitative. Le point rouge suit l'étape affichée.</p>
      </div>
      <div class="card">
        <h4>À retenir</h4>
        <dl id="facts"></dl>
      </div>
      <div class="card" id="atlas-links-card" hidden>
        <h4>Exercices d'atlas liés</h4>
        <ul class="alinks" id="atlas-links"></ul>
      </div>
    </aside>
  </div>
  </div>
</div>

<script>
/* ---------- Données ----------
 atomes : {x,y,l (étiquette), lp (angles des doublets, degrés, 0 = droite, 90 = haut), ch ('+'/'−'), chA (angle de la charge)}
 liaisons : "A-B" simple, "A=B" double, "A>B" coin plein (étroit en A), "A:B" coin hachuré, "A~B" partielle, "A%B" simple + partielle
 flèches : {f, t, b (courbure), lab}, extrémités ['lp',id,angle] | ['at',id,angle] | ['bd',a,b,t,décalage]
 Chaque étape ne redonne que les atomes qui changent (null = supprimé). */
const MECHS = {
 an:{tab:'RMgX + C=O', name:'Addition nucléophile d\'un organomagnésien', reac:'éthanal + CH₃MgBr, puis hydrolyse acide',
  prof:[[0,.6,'réactifs'],[.25,.84,'ET'],[.5,.22,'alcoolate'],[.7,.34,''],[1,.08,'alcool']],
  facts:[['Réactif','Organomagnésien : nucléophile carboné (C δ−), base très forte.'],
    ['Conditions','Solvant anhydre aprotique (éther, THF), puis hydrolyse acide.'],
    ['Bilan','Création d\'une liaison C–C. Méthanal → alcool primaire, aldéhyde → secondaire, cétone → tertiaire.'],
    ['Stéréochimie','Le C=O est plan : attaque équiprobable sur ses deux faces, racémique si un stéréocentre apparaît.']],
  steps:[
   {name:'Réactifs', p:0,
    text:"Dans l'organomagnésien, la liaison C–Mg est polarisée vers le carbone (C δ−) : c'est un nucléophile carboné. Il attaque le carbone électrophile du groupe carbonyle, et le doublet π de C=O bascule sur l'oxygène.",
    a:{Mg:{x:170,y:190,l:'BrMg'}, Cn:{x:255,y:190,l:'H₃C'}, C:{x:400,y:190,l:'C'}, O:{x:478,y:190,l:'O',lp:[0,-90]},
       H:{x:365,y:128,l:'H'}, Me:{x:362,y:254,l:'H₃C'}},
    bonds:['Mg-Cn','C=O','C-H','C-Me'],
    x:[{k:'tx',x:168,y:160,s:'δ+',c:'d'},{k:'tx',x:262,y:220,s:'δ−',c:'d'},{k:'tx',x:420,y:216,s:'δ+',c:'d'},{k:'tx',x:500,y:166,s:'δ−',c:'d'}],
    arrows:[{f:['bd','Mg','Cn'],t:['at','C',180],b:55},{f:['bd','C','O',.5,5],t:['at','O',100],b:18}]},
   {name:'Alcoolate', p:.5,
    text:"Une liaison C–C est créée. On obtient un ion alcoolate, associé à l'ion MgBr⁺. Le milieu doit rester anhydre jusqu'ici : l'eau détruirait l'organomagnésien.",
    a:{Mg:{x:575,y:190,l:'MgBr',ch:'+',chA:60}, Cn:{x:322,y:190,l:'H₃C'}, C:{x:400,y:190,l:'C'},
       O:{x:478,y:190,l:'O',lp:[90,-90,-10],ch:'−',chA:42}, H:{x:400,y:115,l:'H'}, Me:{x:400,y:266,l:'CH₃'}},
    bonds:['Cn-C','C-O','C-H','C-Me']},
   {name:'Hydrolyse acide', p:.5,
    text:"On ajoute ensuite une solution acide. L'ion alcoolate, base forte, capte un proton de l'ion oxonium H₃O⁺.",
    a:{Hh:{x:478,y:114,l:'H'}, Ow:{x:478,y:52,l:'OH₂',lp:[165],ch:'+',chA:55}},
    bonds:['Cn-C','C-O','C-H','C-Me','Hh-Ow'],
    arrows:[{f:['lp','O',90],t:['at','Hh',-90],b:18},{f:['bd','Hh','Ow'],t:['at','Ow',-35],b:-14}]},
   {name:'Alcool', p:1,
    text:"On obtient le propan-2-ol, un alcool secondaire, et de l'eau. Avec une cétone, on aurait obtenu un alcool tertiaire.",
    a:{O:{x:478,y:190,l:'O',lp:[-90,0]}, Hh:{x:478,y:118,l:'H'}, Ow:{x:575,y:70,l:'H₂O',lp:[90,-90]},
       Mg:{x:640,y:200,l:'MgBr',ch:'+',chA:60}},
    bonds:['Cn-C','C-O','C-H','C-Me','O-Hh']}
  ]},
 al:{tab:'Aldolisation', name:'Aldolisation en milieu basique', reac:'2 éthanal, HO⁻ catalytique',
  prof:[[0,.45,'éthanal'],[.17,.75,''],[.33,.6,'énolate'],[.5,.8,''],[.67,.5,'alcoolate'],[.83,.6,''],[1,.35,'aldol']],
  facts:[['Bilan','<span class="f">2 CH₃CHO → CH₃CH(OH)CH₂CHO</span>'],
    ['Condition','Il faut un H sur le carbone α du carbonyle (pKa ≈ 17). HO⁻ est régénéré : catalyse basique.'],
    ['Crotonisation','Par chauffage, l\'aldol se déshydrate en aldéhyde α,β-insaturé conjugué (but-2-énal).'],
    ['Aldolisation croisée','Pour éviter un mélange, un seul partenaire doit être énolisable (ex. benzaldéhyde comme électrophile).']],
  steps:[
   {name:'Énolisation', p:0,
    text:"L'hydrogène porté par le carbone voisin du groupe carbonyle (carbone α) est acide. HO⁻ l'arrache : le doublet de la liaison C–H forme une double liaison C=C et le doublet π de C=O passe sur l'oxygène.",
    a:{O:{x:240,y:130,l:'HO',lp:[90,-90,0],ch:'−',chA:130}, Cx:{x:335,y:205,l:'CH₂'}, Hx:{x:335,y:130,l:'H'},
       Cc:{x:405,y:165,l:'C'}, Hc:{x:405,y:95,l:'H'}, Oc:{x:475,y:205,l:'O',lp:[20,-80]}},
    bonds:['Cx-Hx','Cx-Cc','Cc=Oc','Cc-Hc'],
    arrows:[{f:['lp','O',0],t:['at','Hx',180],b:16},{f:['bd','Cx','Hx'],t:['bd','Cx','Cc',.5,7],b:12},
            {f:['bd','Cc','Oc',.5,5],t:['at','Oc',80],b:12}]},

/* ---------- Géométrie ---------- */
const $ = id => document.getElementById(id);
const lerp = (a,b,t) => a+(b-a)*t;
const rad = d => d*Math.PI/180;
let boxCache = {};
function box(l){
  if(!l) return {hw:0,hh:0};
  if(boxCache[l]) return boxCache[l];
  const m = $('mtext'); m.textContent = l;
  let w = 0; try{ w = m.getBBox().width }catch(e){}
  if(!w) w = l.length*12;
  return boxCache[l] = {hw:w/2+1, hh:11};
}
function ellPt(at, ang, ex, ey){
  const b = box(at.l), rx = Math.max(b.hw+ex, 9), ry = Math.max(b.hh+ey, 9);
  return [at.x + rx*Math.cos(rad(ang)), at.y - ry*Math.sin(rad(ang))];
}
function parseBond(s){
  const m = s.match(/^(\w+)([-=#>:~%])(\w+)$/);
  const a = m[1], op = m[2], b = m[3];
  return {a, b, op, key:[a,b].sort().join('|'), sig:(op==='>'||op===':') ? op+a : op};
}
function resolve(mech, j){
  const atoms = {};
  for(let i=0;i<=j;i++){
    for(const [id,v] of Object.entries(mech.steps[i].a||{})){ if(v===null) delete atoms[id]; else atoms[id]=v; }
  }
  const s = mech.steps[j];
  const atomsOut = {};
  // n'afficher que les atomes utilisés par l'étape (liaisons ou définis à cette étape ou avant et non supprimés)
  for(const id in atoms) atomsOut[id] = atoms[id];
  return {atoms:atomsOut, bonds:(s.bonds||[]).map(parseBond), x:s.x||[], arrows:s.arrows||[], p:s.p};
}
const decoSig = a => JSON.stringify([a.l,a.lp||[],a.ch||'',a.chA||45]);

/* ---------- Dessin ---------- */
let showLP = true;
function clipD(ux,uy,b){
  if(!b.hw) return 0;
  const hw=b.hw+3, hh=b.hh+3;
  const sx = Math.abs(ux)>1e-6 ? hw/Math.abs(ux) : 1e9;
  const sy = Math.abs(uy)>1e-6 ? hh/Math.abs(uy) : 1e9;
  return Math.min(sx,sy);
}
function bondSVG(bd, P, alpha){
  const A=P[bd.a], B=P[bd.b]; if(!A||!B) return '';
  let dx=B.x-A.x, dy=B.y-A.y; const L=Math.hypot(dx,dy)||1; const ux=dx/L, uy=dy/L;
  const da=clipD(ux,uy,A.bx), db=clipD(ux,uy,B.bx);
  const x1=A.x+ux*da, y1=A.y+uy*da, x2=B.x-ux*db, y2=B.y-uy*db;
  const nx=uy, ny=-ux; // normale (vers le haut pour une liaison gauche→droite)
  const ln=(o,cls='bd')=>`<line class="${cls}" x1="${(x1+nx*o).toFixed(1)}" y1="${(y1+ny*o).toFixed(1)}" x2="${(x2+nx*o).toFixed(1)}" y2="${(y2+ny*o).toFixed(1)}"/>`;
  let s='';
  switch(bd.op){
    case '-': s=ln(0); break;
    case '=': s=ln(3.6)+ln(-3.6); break;
    case '#': s=ln(0)+ln(5)+ln(-5); break;
    case '~': s=ln(0,'bd dash'); break;
    case '%': s=ln(-3.6)+ln(3.6,'bd dash'); break;
    case '>': s=`<polygon class="wedge" points="${x1.toFixed(1)},${y1.toFixed(1)} ${(x2+nx*5).toFixed(1)},${(y2+ny*5).toFixed(1)} ${(x2-nx*5).toFixed(1)},${(y2-ny*5).toFixed(1)}"/>`; break;
    case ':': { for(let i=0;i<7;i++){ const t=.08+i*.92/6, cx=lerp(x1,x2,t), cy=lerp(y1,y2,t), w=.8+t*4.6;
        s+=`<line class="bd" style="stroke-width:1.6" x1="${(cx+nx*w).toFixed(1)}" y1="${(cy+ny*w).toFixed(1)}" x2="${(cx-nx*w).toFixed(1)}" y2="${(cy-ny*w).toFixed(1)}"/>`; } }
  }
  return alpha>=.999 ? s : `<g opacity="${alpha.toFixed(3)}">${s}</g>`;
}
function atomSVG(at, x, y, alpha){
  if(alpha<.01) return '';
  const a = Object.assign({}, at, {x, y});
  let s = '';
  if(a.l) s += `<text class="lbl" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="central">${a.l}</text>`;
  if(showLP) for(const ang of a.lp||[]){
    const [px,py] = ellPt(a, ang, 6, 5); const tx=Math.sin(rad(ang))*3.7, ty=Math.cos(rad(ang))*3.7;
    s += `<circle class="lp" cx="${(px+tx).toFixed(1)}" cy="${(py+ty).toFixed(1)}" r="2.1"/><circle class="lp" cx="${(px-tx).toFixed(1)}" cy="${(py-ty).toFixed(1)}" r="2.1"/>`;
  }
  if(a.ch){
    const [cx,cy] = ellPt(a, a.chA??45, 17, 14);
    s += `<g class="chg"><circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="8"/><text x="${cx.toFixed(1)}" y="${(cy+.5).toFixed(1)}" text-anchor="middle" dominant-baseline="central">${a.ch}</text></g>`;
  }
  return alpha>=.999 ? s : `<g opacity="${alpha.toFixed(3)}">${s}</g>`;
}
function extraSVG(e, alpha){
  if(alpha<.01) return '';
  let s='';
  if(e.k==='br'){
    s=`<path class="brk" d="M${e.x1+9} ${e.y1} H${e.x1} V${e.y2} H${e.x1+9} M${e.x2-9} ${e.y1} H${e.x2} V${e.y2} H${e.x2-9}"/><text class="mark" x="${e.x2+5}" y="${e.y1+14}">${e.m}</text>`;
  } else s=`<text class="n-${e.c||'n'}" x="${e.x}" y="${e.y}" text-anchor="middle">${e.s}</text>`;
  return alpha>=.999 ? s : `<g opacity="${alpha.toFixed(3)}">${s}</g>`;
}
function renderFrame(A, B, t){
  const P = {}; let atomsS='', bondsS='', extrasS='';
  const ids = new Set([...Object.keys(A.atoms), ...Object.keys(B.atoms)]);
  for(const id of ids){
    const a=A.atoms[id], b=B.atoms[id];
    if(a&&b){
      const x=lerp(a.x,b.x,t), y=lerp(a.y,b.y,t), ba=box(a.l), bb=box(b.l);
      P[id]={x,y,bx:{hw:lerp(ba.hw,bb.hw,t),hh:lerp(ba.hh,bb.hh,t)}};
      if(decoSig(a)===decoSig(b)) atomsS+=atomSVG(b,x,y,1); else atomsS+=atomSVG(a,x,y,1-t)+atomSVG(b,x,y,t);
    } else if(a){ P[id]={x:a.x,y:a.y,bx:box(a.l)}; atomsS+=atomSVG(a,a.x,a.y,1-t); }
    else { P[id]={x:b.x,y:b.y,bx:box(b.l)}; atomsS+=atomSVG(b,b.x,b.y,t); }
  }
  const mA = new Map(A.bonds.map(b=>[b.key,b])), mB = new Map(B.bonds.map(b=>[b.key,b]));
  for(const [k,b] of mB){ const a=mA.get(k); if(a && a.sig===b.sig) bondsS+=bondSVG(b,P,1); else { if(a) bondsS+=bondSVG(a,P,1-t); bondsS+=bondSVG(b,P,t); } }
  for(const [k,a] of mA) if(!mB.has(k)) bondsS+=bondSVG(a,P,1-t);
  const xs = e => JSON.stringify(e);
  const sB = new Set(B.x.map(xs)), sA = new Set(A.x.map(xs));
  for(const e of A.x) if(!sB.has(xs(e))) extrasS+=extraSVG(e,1-t);
  for(const e of B.x) extrasS+=extraSVG(e, sA.has(xs(e)) ? 1 : t);
  $('g-mol').innerHTML = extrasS + bondsS + atomsS;
}

/* ---------- Flèches courbes ---------- */
function endPt(S, e){
  const at = S.atoms[e[1]];
  if(e[0]==='lp') return ellPt(at, e[2], 9, 8);
  if(e[0]==='at') return ellPt(at, e[2], 5, 5);
  const B = S.atoms[e[2]], t = e[3]??.5, o = e[4]||0;
  const dx=B.x-at.x, dy=B.y-at.y, L=Math.hypot(dx,dy);
  return [lerp(at.x,B.x,t) + dy/L*o, lerp(at.y,B.y,t) - dx/L*o];
}
function drawArrows(S, instant){
  const g = $('g-arr'); g.innerHTML='';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  S.arrows.forEach((ar,i)=>{
    const [x0,y0]=endPt(S,ar.f), [x1,y1]=endPt(S,ar.t);
    const dx=x1-x0, dy=y1-y0, L=Math.hypot(dx,dy)||1, nx=dy/L, ny=-dx/L;
    const cx=(x0+x1)/2+nx*(ar.b||0), cy=(y0+y1)/2+ny*(ar.b||0);
    let tx=x1-cx, ty=y1-cy; const tl=Math.hypot(tx,ty)||1; tx/=tl; ty/=tl;
    const ex=x1-tx*7, ey=y1-ty*7, bx=x1-tx*12, by=y1-ty*12;
    const ns='http://www.w3.org/2000/svg';
    const path=document.createElementNS(ns,'path');
    path.setAttribute('d',`M${x0.toFixed(1)} ${y0.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`);
    const head=document.createElementNS(ns,'polygon');
    head.setAttribute('points',`${x1.toFixed(1)},${y1.toFixed(1)} ${(bx-ty*5).toFixed(1)},${(by+tx*5).toFixed(1)} ${(bx+ty*5).toFixed(1)},${(by-tx*5).toFixed(1)}`);
    g.append(path, head);
    let lab=null;
    if(ar.lab){
      const s=Math.sign(ar.b||1);
      const mx=.25*x0+.5*cx+.25*x1+nx*14*s, my=.25*y0+.5*cy+.25*y1+ny*14*s;
      lab=document.createElementNS(ns,'text'); lab.textContent=ar.lab;
      lab.setAttribute('x',mx.toFixed(1)); lab.setAttribute('y',(my+5).toFixed(1)); lab.setAttribute('text-anchor','middle');
      g.append(lab);
    }
    if(instant||reduce||!path.animate) return;
    const len=path.getTotalLength(), d=i*420;
    path.style.strokeDasharray=len;
    path.animate([{strokeDashoffset:len},{strokeDashoffset:0}],{duration:520,delay:d,easing:'ease-out',fill:'both'});
    head.animate([{opacity:0},{opacity:1}],{duration:150,delay:d+460,fill:'both'});
    if(lab) lab.animate([{opacity:0},{opacity:1}],{duration:250,delay:d+460,fill:'both'});
  });
}

/* ---------- Profil énergétique ---------- */
const PX0=34, PX1=290, PY0=16, PY1=150;
function profE(kp, x){
  for(let k=0;k<kp.length-1;k++){
    const [xa,ea]=kp[k], [xb,eb]=kp[k+1];
    if(x<=xb||k===kp.length-2){ const s=Math.min(1,Math.max(0,(x-xa)/(xb-xa))); return ea+(eb-ea)*(1-Math.cos(Math.PI*s))/2; }
  }
}
const px = x => PX0+12+x*(PX1-PX0-24), py = e => PY1-e*(PY1-PY0-6);
function drawProfile(m){
  let d='';
  for(let i=0;i<=160;i++){ const x=i/160; d+=(i?'L':'M')+px(x).toFixed(1)+' '+py(profE(m.prof,x)).toFixed(1); }
  let labs='';
  m.prof.forEach((k,i)=>{
    if(!k[2]) return;
    const prev=m.prof[i-1], next=m.prof[i+1];
    const isMax = (!prev||k[1]>prev[1]) && (!next||k[1]>next[1]) && prev && next;
    const y = isMax ? py(k[1])-8 : py(k[1])+17;
    const anchor = i===0 ? 'start' : (i===m.prof.length-1 ? 'end' : 'middle');
    const x = i===0 ? px(k[0])-10 : (i===m.prof.length-1 ? px(k[0])+10 : px(k[0]));
    labs+=`<text class="kpl" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}">${k[2]}</text>`;
  });
  $('profile').innerHTML =
    `<path class="ax" d="M${PX0} ${PY1+14} V${PY0-6} M${PX0-4} ${PY0} L${PX0} ${PY0-6} L${PX0+4} ${PY0} M${PX0} ${PY1+14} H${PX1+6} M${PX1} ${PY1+10} L${PX1+6} ${PY1+14} L${PX1} ${PY1+18}"/>`+
    `<text class="axt" x="${PX0-6}" y="${PY0+4}" text-anchor="end">E</text>`+
    `<text class="axt" x="${PX1+4}" y="${PY1+30}" text-anchor="end">coordonnée de réaction</text>`+
    `<path class="curve" d="${d}"/>${labs}<circle class="dot" id="pdot" r="6"/>`;
}
function placeDot(m, x){ const c=$('pdot'); if(!c) return; c.setAttribute('cx',px(x).toFixed(1)); c.setAttribute('cy',py(profE(m.prof,x)).toFixed(1)); }

/* ---------- Pilotage ---------- */
let mk='sn2', cur=0, shown=null, raf=0, playing=null, revealed=false;
const mech = () => MECHS[mk];
function stepUI(){
  const m=mech(), s=m.steps[cur];
  $('stepname').textContent = `${cur+1}. ${s.name}`;
  $('steptext').textContent = s.text;
  $('btn-prev').disabled = cur===0; $('btn-next').disabled = cur===m.steps.length-1;
  [...$('steps').children].forEach((b,i)=> i===cur ? b.setAttribute('aria-current','step') : b.removeAttribute('aria-current'));
  const quiz = $('chk-quiz').checked, has = (s.arrows||[]).length>0;
  $('btn-reveal').hidden = !(quiz && has && !revealed);
  $('quizhint').hidden = !(quiz && has && !revealed);
}
function arrowsNow(instant){
  const s = shown; if(!s) return;
  const quiz=$('chk-quiz').checked;
  if(quiz && !revealed){ $('g-arr').innerHTML=''; return; }
  drawArrows(s, instant);
}
function go(j, instant){
  const m=mech(); if(j<0||j>=m.steps.length) return;
  if(raf){ cancelAnimationFrame(raf); raf=0; }
  const B = resolve(m,j), A = shown || B;
  const pA = A.p, pB = B.p;
  cur=j; revealed=false; stepUI();
  $('g-arr').innerHTML='';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur = (instant||reduce||A===B) ? 0 : 900, t0 = performance.now();
  const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  const tick = now => {
    const t = dur ? Math.min(1,(now-t0)/dur) : 1, e = ease(t);
    renderFrame(A,B,e); placeDot(m, lerp(pA,pB,e));
    if(t<1) raf=requestAnimationFrame(tick);
    else { raf=0; shown=B; arrowsNow(false); }
  };
  if(dur) raf=requestAnimationFrame(tick); else tick(t0);
}
function selectMech(k, push){
  if(!MECHS[k]) k='sn2';
  mk=k; shown=null; stopPlay();
  const m=mech();
  $('tabs').querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', b.dataset.k===k));
  $('mname').textContent=m.name; $('mreac').textContent=`${META[k][0]} · chapitre ${Math.floor(META[k][1])} · ${m.reac}`;
  $('steps').innerHTML='';
  m.steps.forEach((s,i)=>{ const b=document.createElement('button'); b.className='pill'; b.textContent=`${i+1} · ${s.name}`; b.onclick=()=>{stopPlay(); go(i)}; $('steps').append(b); });
  $('facts').innerHTML = m.facts.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  drawProfile(m);
  go(0,true);
  if(typeof renderAtlasLinks==='function' && ATLAS.length) renderAtlasLinks();
  if(push){ try{ history.replaceState(null,'','#'+k) }catch(e){} }
}
function stopPlay(){ if(playing){ clearInterval(playing); playing=null; } $('btn-play').textContent='Lecture'; }
function togglePlay(){
  if(playing){ stopPlay(); return; }
  if(cur===mech().steps.length-1) go(0);
  $('btn-play').textContent='Pause';
  playing=setInterval(()=>{ if(cur>=mech().steps.length-1) stopPlay(); else go(cur+1); }, 3400);
}

function init(){
  const groups={PCSI:[],PC:[]};
  Object.keys(MECHS).sort((a,b)=>META[a][1]-META[b][1]).forEach(k=>groups[META[k][0]].push(k));
  for(const [g,ks] of Object.entries(groups)){
    if(!ks.length) continue;
    const row=document.createElement('div'); row.className='tabrow';
    const lab=document.createElement('span'); lab.className='tabgrp'; lab.textContent=g; row.append(lab);
    for(const k of ks){
      const b=document.createElement('button'); b.className='tab'; b.role='tab'; b.dataset.k=k; b.textContent=MECHS[k].tab;
      b.onclick=()=>selectMech(k,true); row.append(b);
    }
    $('tabs').append(row);
  }
  $('btn-prev').onclick=()=>{stopPlay(); go(cur-1)};
  $('btn-next').onclick=()=>{stopPlay(); go(cur+1)};
  $('btn-play').onclick=togglePlay;
  $('btn-reveal').onclick=()=>{ revealed=true; stepUI(); arrowsNow(false); };
  $('chk-lp').onchange=e=>{ showLP=e.target.checked; if(shown) renderFrame(shown,shown,1); };
  $('chk-quiz').onchange=()=>{ revealed=false; stepUI(); arrowsNow(true); };
  document.addEventListener('keydown',e=>{
    if(e.target.closest('input') || $('view-meca').hidden) return;
    if(e.key==='ArrowRight'){ stopPlay(); go(cur+1); }
    else if(e.key==='ArrowLeft'){ stopPlay(); go(cur-1); }
  });
  $('vb-meca').onclick=()=>{ setView('meca'); try{ history.replaceState(null,'','#'+mk) }catch(e){} };
  $('vb-atlas').onclick=()=>openAtlas(atlasCourant || 'pc11');
  const h=(location.hash||'').slice(1);
  selectMech(MECHS[h]?h:'da', false);
  loadIndex().then(router);
  window.addEventListener('hashchange', router);
}
// #sn2 ouvre un mécanisme, #atlas-pcsi9 un atlas, #atlas-pcsi9-3 son exercice 3
function router(){
  const h=(location.hash||'').slice(1);
  const m=h.match(/^atlas-([a-z][a-z0-9]*?)(?:-(\d+))?$/);
  if(m) openAtlas(m[1], m[2]?+m[2]:null);
  else if(MECHS[h]){ setView('meca'); if(h!==mk) selectMech(h,false); }
}

/* ---------- Atlas corrigés ---------- */
let ATLAS=[], atlasCourant=null;
const atlasCache={};
function setView(v){
  $('view-meca').hidden = v!=='meca'; $('view-atlas').hidden = v!=='atlas';
  $('vb-meca').setAttribute('aria-selected', v==='meca'); $('vb-atlas').setAttribute('aria-selected', v==='atlas');
  if(v==='atlas') stopPlay();
}
async function loadIndex(){
  try{ const r=await fetch('atlas/index.json',{cache:'no-cache'}); if(!r.ok) throw 0; ATLAS=await r.json(); }catch(e){ ATLAS=[]; }
  const t=$('atlas-tabs'), sel=$('atlas-select'); t.innerHTML=''; sel.innerHTML='';
  const maj = s => s[0].toUpperCase()+s.slice(1);
  for(const g of ['PCSI','PC']){
    if(!ATLAS.some(c=>c.classe===g)) continue;
    const h=document.createElement('h4'); h.textContent='Chapitres'; t.append(h);
    const og=document.createElement('optgroup'); og.label=g; sel.append(og);
    for(const c of ATLAS.filter(c=>c.classe===g)){
      const num = typeof c.chap==='number' ? c.chap : '';
      const b=document.createElement('button'); b.className='aitem'; b.dataset.a=c.id;
      b.innerHTML=`<span class="an">${num}</span><span>${maj(c.titre)}</span>`;
      b.onclick=()=>openAtlas(c.id); t.append(b);
      const o=document.createElement('option'); o.value=c.id; o.innerHTML=(num?num+'. ':'')+maj(c.titre); og.append(o);
    }
  }
  sel.onchange=()=>openAtlas(sel.value);
  renderAtlasLinks();
}
function renderAtlasLinks(){
  const ul=$('atlas-links'); ul.innerHTML='';
  for(const c of ATLAS) for(const x of c.exos) if(x.meca.includes(mk)){
    const li=document.createElement('li'), a=document.createElement('a');
    a.href='#atlas-'+c.id+'-'+x.n; a.innerHTML=`${c.classe} ${typeof c.chap==='number'?'ch. '+c.chap:c.chap}, exercice ${x.n} : ${x.titre}`;
    a.onclick=e=>{ e.preventDefault(); openAtlas(c.id, x.n); };
    li.append(a); ul.append(li);
  }
  $('atlas-links-card').hidden = !ul.children.length;
}
async function openAtlas(id, n){
  setView('atlas'); atlasCourant=id;
  $('atlas-tabs').querySelectorAll('.aitem').forEach(b=>b.setAttribute('aria-current', b.dataset.a===id));
  $('atlas-select').value=id;
  try{ history.replaceState(null,'','#atlas-'+id) }catch(e){}
  const body=$('atlas-body');
  const info=ATLAS.find(c=>c.id===id);
  if(!info){ body.innerHTML='<p class="amsg">Les atlas ne sont pas disponibles ici : ouvrez la page publiée pour les consulter.</p>'; return; }
  body.innerHTML='<p class="amsg">Chargement de l\'atlas…</p>';
  let d=atlasCache[id];
  if(!d){ try{ const r=await fetch('atlas/'+id+'.json',{cache:'no-cache'}); d=atlasCache[id]=await r.json(); }
          catch(e){ body.innerHTML='<p class="amsg">Impossible de charger cet atlas. Vérifiez la connexion puis réessayez.</p>'; return; } }
  if(atlasCourant!==id) return;
  body.innerHTML='';
  const h=document.createElement('div'); h.className='achap';
  h.innerHTML=`<h2>${d.titre[0].toUpperCase()+d.titre.slice(1)}</h2><span>${d.classe}${typeof d.chap==='number'?' · chapitre '+d.chap:''} · ${d.exos.length} exercices</span>`;
  body.append(h);
  for(const x of d.exos){
    const art=document.createElement('article'); art.className='exo'; art.id='ex-'+x.n;
    art.innerHTML=`<div class="exo-h"><span class="exo-n">Exercice ${x.n}</span><h3>${x.titre}</h3>${x.diff?`<span class="diff" title="difficulté">${'★'.repeat(x.diff)}</span>`:''}</div>
      <div class="sheet">${x.enonce}</div>
      <div class="exo-a"><button class="btn">Afficher la correction</button></div>
      <div class="sheet corr" hidden>${x.corrige}</div>`;
    const btn=art.querySelector('.btn'), corr=art.querySelector('.corr');
    btn.setAttribute('aria-expanded','false');
    btn.onclick=()=>{ corr.hidden=!corr.hidden; btn.textContent=corr.hidden?'Afficher la correction':'Masquer la correction'; btn.setAttribute('aria-expanded', !corr.hidden); };
    for(const k of x.meca){ if(!MECHS[k]) continue;
      const c=document.createElement('button'); c.className='chip'; c.textContent='▶ '+MECHS[k].tab;
      c.title='Voir le mécanisme animé'; c.onclick=()=>{ setView('meca'); selectMech(k,true); window.scrollTo(0,0); };
      art.querySelector('.exo-a').append(c); }
    art.querySelectorAll('img[data-k]').forEach(im=>{
      im.src=d.img[im.dataset.k]||'';
      if(im.classList.contains('tikz')) im.onload=()=>{ im.style.width=(im.naturalWidth/2)+'px'; };
    });
    body.append(art);
  }
  if(n){ const el=document.getElementById('ex-'+n); if(el) el.scrollIntoView({block:'start'}); }
  else window.scrollTo(0,0);
}
const fontsReady = document.fonts ? Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r,1500))]) : Promise.resolve();
fontsReady.then(()=>{ boxCache={}; init(); });
</script>
